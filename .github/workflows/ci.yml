name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Adapter integration tests
        run: npm run test:integration

      - name: Isolated real-PM2 E2E test
        run: npm run test:e2e
        env:
          # Belt-and-suspenders: even though the test itself always derives
          # PM2_HOME from a fresh mkdtemp() directory (see
          # tests/e2e/pm2-isolation-guard.ts), the runner's own PM2_HOME is
          # deliberately left unset here so there is no ambient real PM2_HOME
          # for a test bug to accidentally inherit.
          PM2_HOME: ''

      - name: Build
        run: npm run build

      - name: Package dry-run inspection
        run: npm pack --dry-run
